<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Panel de Abordaje · Asamblea 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:   #14213D;
      --navy2:  #1B2B4E;
      --orange: #EA580C;
      --gold:   #E3B04B;
      --green:  #16A34A;
      --gbg:    #DCFCE7;
      --gborder:#86EFAC;
      --red:    #DC2626;
      --rbg:    #FEE2E2;
      --gray:   #6B7280;
      --border: #E5E7EB;
      --bg:     #F3F4F6;
      --white:  #FFFFFF;
      --font:   'Plus Jakarta Sans', sans-serif;
      --mono:   'Space Grotesk', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--navy); min-height: 100vh; }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--navy); color: #fff;
      padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      position: sticky; top: 0; z-index: 40;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .topbar-left   { display: flex; align-items: center; gap: 10px; }
    .topbar-emoji  { font-size: 1.4rem; }
    .topbar-title  { font-size: 0.9rem; font-weight: 800; line-height: 1.2; }
    .topbar-sub    { font-size: 0.68rem; color: rgba(255,255,255,0.5); }
    .topbar-right  { display: flex; align-items: center; gap: 8px; }
    .user-pill {
      background: var(--orange); color: #fff;
      padding: 4px 12px; border-radius: 9999px;
      font-size: 0.75rem; font-weight: 800; letter-spacing: 0.05em;
    }
    .btn-sm {
      padding: 6px 12px; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px; background: transparent; color: rgba(255,255,255,0.7);
      font-size: 0.75rem; font-weight: 600; cursor: pointer; font-family: var(--font);
      transition: all 0.15s;
    }
    .btn-sm:hover { background: rgba(255,255,255,0.12); color: #fff; }

    /* ── LOGIN ── */
    #loginScreen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .login-box {
      background: var(--white); border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      padding: 36px 28px; width: 100%; max-width: 360px;
    }
    .login-icon  { text-align: center; font-size: 2.8rem; margin-bottom: 8px; }
    .login-title { text-align: center; font-size: 1.2rem; font-weight: 800; margin-bottom: 4px; }
    .login-sub   { text-align: center; font-size: 0.8rem; color: var(--gray); margin-bottom: 28px; line-height: 1.5; }
    .field-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
                   letter-spacing: 0.07em; color: var(--gray); margin-bottom: 6px; display: block; }
    .field-input {
      width: 100%; height: 48px; padding: 0 14px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 0.95rem; font-family: var(--font); color: var(--navy);
      background: var(--bg); outline: none; transition: border 0.2s; margin-bottom: 14px;
    }
    .field-input:focus { border-color: var(--orange); background: var(--white); }
    .btn-login {
      width: 100%; height: 50px; background: var(--navy);
      color: #fff; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 800; font-family: var(--font);
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 0.2s;
    }
    .btn-login:hover { opacity: 0.86; }
    .login-err {
      margin-top: 12px; padding: 10px 14px; border-radius: 8px;
      background: var(--rbg); color: var(--red);
      font-size: 0.82rem; font-weight: 600; display: none; text-align: center;
    }

    /* ── APP ── */
    #appScreen { display: none; }
    .container { max-width: 680px; margin: 0 auto; padding: 18px 14px 40px; }

    /* ── STATS ── */
    .stats-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 18px;
    }
    .stat-card {
      background: var(--white); border-radius: 12px;
      padding: 14px 16px; border-left: 4px solid var(--orange);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .stat-card.ret { border-left-color: var(--green); }
    .stat-lbl { font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
                letter-spacing: 0.08em; color: var(--gray); margin-bottom: 5px; }
    .stat-val { font-size: 1.6rem; font-weight: 900; font-family: var(--mono);
                line-height: 1; color: var(--navy); }
    .stat-bar { margin-top: 8px; height: 5px; background: var(--border); border-radius: 9999px; overflow: hidden; }
    .stat-fill { height: 100%; background: var(--green); border-radius: 9999px; transition: width 0.4s ease; }

    /* ── CONTROLES ── */
    .ctrl-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .tabs     { display: flex; border-radius: 9px; overflow: hidden;
                border: 1.5px solid var(--border); background: var(--white); }
    .tab      {
      padding: 9px 16px; border: none; background: transparent;
      font-size: 0.8rem; font-weight: 700; font-family: var(--font);
      cursor: pointer; color: var(--gray); transition: all 0.15s;
    }
    .tab.active { background: var(--navy); color: #fff; }
    .bus-tabs { display: flex; gap: 6px; }
    .bus-tab  {
      padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 8px;
      background: var(--white); font-size: 0.8rem; font-weight: 700;
      font-family: var(--font); cursor: pointer; color: var(--gray); transition: all 0.15s;
    }
    .bus-tab.active { background: var(--orange); border-color: var(--orange); color: #fff; }
    .search-wrap { flex: 1; min-width: 140px; position: relative; }
    .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--gray); }
    .search-in {
      width: 100%; height: 40px; padding: 0 12px 0 36px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 0.85rem; font-family: var(--font); color: var(--navy);
      background: var(--white); outline: none;
    }
    .search-in:focus { border-color: var(--orange); }

    /* ── LISTA ── */
    .p-list { display: flex; flex-direction: column; gap: 5px; }

    .p-item {
      display: flex; align-items: center; gap: 11px;
      background: var(--white); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 11px 13px;
      cursor: pointer; transition: all 0.12s; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .p-item:active       { transform: scale(0.99); }
    .p-item:hover        { border-color: var(--orange); }
    .p-item.boarded      { background: var(--gbg); border-color: var(--gborder); }
    .p-item.saving       { opacity: 0.5; pointer-events: none; }

    .p-cb {
      width: 32px; height: 32px; border-radius: 7px; flex-shrink: 0;
      border: 2px solid var(--border); background: var(--white);
      display: flex; align-items: center; justify-content: center; font-size: 1rem;
      transition: all 0.12s;
    }
    .p-item.boarded .p-cb { background: var(--green); border-color: var(--green); }

    .p-info  { flex: 1; min-width: 0; }
    .p-name  { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-sub   { font-size: 0.7rem; color: var(--gray); margin-top: 1px; }
    .p-item.boarded .p-sub { color: var(--green); font-weight: 600; }

    .p-seat  {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: 7px;
      background: #FEF8EE; border: 1px solid #EEDFC2;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.82rem; font-weight: 900; color: var(--orange); font-family: var(--mono);
    }
    .p-item.boarded .p-seat { background: var(--green); border-color: var(--green); color: #fff; }

    .p-hora {
      flex-shrink: 0; font-size: 0.67rem; font-family: var(--mono); font-weight: 700;
      color: var(--green); min-width: 40px; text-align: right; line-height: 1.3;
    }

    .empty { text-align: center; padding: 48px 20px; color: var(--gray); font-size: 0.88rem;
             background: var(--white); border-radius: 12px; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: var(--navy); color: #fff;
      padding: 11px 20px; border-radius: 10px;
      font-size: 0.85rem; font-weight: 600;
      transition: transform 0.25s ease; z-index: 100;
      white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.ok   { background: var(--green); }
    .toast.undo { background: var(--gray); }

    /* ── RESET BTN ── */
    .danger-zone {
      margin-top: 32px; padding: 16px;
      background: var(--white); border-radius: 12px; border: 1px solid var(--border);
    }
    .danger-zone h4 { font-size: 0.8rem; color: var(--gray); margin-bottom: 10px; }
    .btn-danger {
      padding: 8px 16px; background: var(--white); border: 1.5px solid var(--red);
      border-radius: 8px; color: var(--red); font-size: 0.82rem; font-weight: 700;
      font-family: var(--font); cursor: pointer; transition: all 0.15s;
    }
    .btn-danger:hover { background: var(--rbg); }

    @media (max-width: 420px) {
      .topbar-sub { display: none; }
      .stat-val   { font-size: 1.35rem; }
    }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ════════ LOGIN ════════ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-icon">🚌</div>
    <div class="login-title">Panel de Abordaje</div>
    <div class="login-sub">Asamblea de Circuito 2026-2027<br>Sábado 07 de Noviembre · Cusco → Urubamba</div>

    <label class="field-label" for="uUser">Usuario</label>
    <input type="text" id="uUser" class="field-input" placeholder="julio  ó  lino" autocomplete="username">

    <label class="field-label" for="uPass">Contraseña</label>
    <input type="password" id="uPass" class="field-input" placeholder="••••••••" autocomplete="current-password">

    <button class="btn-login" id="btnLogin">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Ingresar
    </button>
    <div class="login-err" id="loginErr">Usuario o contraseña incorrectos.</div>
  </div>
</div>

<!-- ════════ APP ════════ -->
<div id="appScreen">

  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-emoji">🚌</div>
      <div>
        <div class="topbar-title">Control de Abordaje</div>
        <div class="topbar-sub">Asamblea 2026-2027 · 07 Nov</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="user-pill" id="userPill">JULIO</span>
      <button class="btn-sm" id="btnLogout">Salir</button>
    </div>
  </div>

  <div class="container">

    <!-- Estadísticas -->
    <div class="stats-row" id="statsRow">
      <div class="stat-card">
        <div class="stat-lbl" id="statLblA">Bus 1 · IDA</div>
        <div class="stat-val" id="statValA">0/0</div>
        <div class="stat-bar"><div class="stat-fill" id="statBarA" style="width:0%"></div></div>
      </div>
      <div class="stat-card ret">
        <div class="stat-lbl" id="statLblB">Bus 1 · RETORNO</div>
        <div class="stat-val" id="statValB">0/0</div>
        <div class="stat-bar"><div class="stat-fill" id="statBarB" style="width:0%"></div></div>
      </div>
    </div>

    <!-- Controles -->
    <div class="ctrl-row">
      <div class="tabs">
        <button class="tab active" id="tabIda"    onclick="setSeg('ida')">IDA</button>
        <button class="tab"        id="tabVuelta" onclick="setSeg('vuelta')">RETORNO</button>
      </div>
      <div class="bus-tabs">
        <button class="bus-tab active" id="tBus1" onclick="setBus('1')">Bus 1</button>
        <button class="bus-tab"        id="tBus2" onclick="setBus('2')">Bus 2</button>
      </div>
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-in" id="searchIn" placeholder="Buscar nombre..." oninput="render()">
      </div>
    </div>

    <!-- Lista de pasajeros -->
    <div class="p-list" id="pList"></div>

    <!-- Zona de reset (emergencia) -->
    <div class="danger-zone">
      <h4>⚙️ Opciones avanzadas</h4>
      <button class="btn-danger" onclick="resetConfirm()">Borrar todos los registros de abordaje</button>
    </div>

  </div>
</div>

<script>
// ══════════════════════════════════════
//  CREDENCIALES DE ADMINISTRADORES
//  (cambia las contraseñas si quieres)
// ══════════════════════════════════════
const ADMINS = {
  'julio': '2027Cusco',
  'lino':  '2027Cusco'
};

// ══════════════════════════════════════
//  ESTADO
// ══════════════════════════════════════
let passengers   = [];   // cargados desde passengers_data.json
let boarding     = {};   // { "P-01_ida": { abordado: true, hora: "07:12:34" }, ... }
let activeUser   = null;
let activeSeg    = 'ida';
let activeBus    = '1';

const LS_BOARD = 'asamblea_boarding_2026';
const LS_USER  = 'asamblea_admin_user';

// ══════════════════════════════════════
//  INICIO
// ══════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  // Restaurar sesión
  const saved = sessionStorage.getItem(LS_USER);
  if (saved) { activeUser = saved; }

  // Cargar pasajeros
  try {
    const r = await fetch('passengers_data.json');
    passengers = await r.json();
  } catch(e) {
    passengers = [];
  }

  // Cargar estado de abordaje desde localStorage
  loadBoarding();

  // Mostrar pantalla correcta
  if (activeUser) showApp(); 

  // Listeners
  document.getElementById('btnLogin').addEventListener('click', doLogin);
  document.getElementById('btnLogout').addEventListener('click', doLogout);
  document.getElementById('uPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  document.getElementById('uUser').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('uPass').focus(); });
});

// ══════════════════════════════════════
//  LOGIN / LOGOUT
// ══════════════════════════════════════
function doLogin() {
  const user = (document.getElementById('uUser').value||'').toLowerCase().trim();
  const pass = document.getElementById('uPass').value||'';
  const err  = document.getElementById('loginErr');

  if (ADMINS[user] && ADMINS[user] === pass) {
    err.style.display = 'none';
    activeUser = user;
    sessionStorage.setItem(LS_USER, user);
    showApp();
  } else {
    err.style.display = 'block';
    document.getElementById('uPass').value = '';
    document.getElementById('uPass').focus();
  }
}

function doLogout() {
  sessionStorage.removeItem(LS_USER);
  activeUser = null;
  document.getElementById('appScreen').style.display   = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('uUser').value = '';
  document.getElementById('uPass').value = '';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display   = 'block';
  document.getElementById('userPill').textContent       = activeUser.toUpperCase();
  updateStats();
  render();
}

// ══════════════════════════════════════
//  PERSISTENCIA — localStorage
// ══════════════════════════════════════
function loadBoarding() {
  try {
    boarding = JSON.parse(localStorage.getItem(LS_BOARD) || '{}');
  } catch(e) { boarding = {}; }
}

function saveBoarding() {
  localStorage.setItem(LS_BOARD, JSON.stringify(boarding));
}

// ══════════════════════════════════════
//  FILTROS
// ══════════════════════════════════════
function setSeg(seg) {
  activeSeg = seg;
  document.getElementById('tabIda').classList.toggle('active',    seg==='ida');
  document.getElementById('tabVuelta').classList.toggle('active', seg==='vuelta');
  updateStats();
  render();
}

function setBus(bus) {
  activeBus = bus;
  document.getElementById('tBus1').classList.toggle('active', bus==='1');
  document.getElementById('tBus2').classList.toggle('active', bus==='2');
  updateStats();
  render();
}

function norm(s) {
  return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}

// ══════════════════════════════════════
//  ESTADÍSTICAS
// ══════════════════════════════════════
function updateStats() {
  // Bus activo, ambos tramos
  const idaKey    = activeBus + '_ida';
  const vueltaKey = activeBus + '_vuelta';

  const forIda    = passengers.filter(p => String(p.ida_bus)    === activeBus);
  const forVuelta = passengers.filter(p => String(p.vuelta_bus) === activeBus);

  const abIda    = forIda.filter(p    => boarding[p.id + '_ida']?.abordado).length;
  const abVuelta = forVuelta.filter(p => boarding[p.id + '_vuelta']?.abordado).length;

  setStatEl('A', `Bus ${activeBus} · IDA`,    abIda,    forIda.length);
  setStatEl('B', `Bus ${activeBus} · RETORNO`, abVuelta, forVuelta.length);
}

function setStatEl(id, lbl, ab, total) {
  document.getElementById('statLbl' + id).textContent = lbl;
  document.getElementById('statVal' + id).textContent = `${ab}/${total}`;
  const pct = total > 0 ? Math.round(ab/total*100) : 0;
  document.getElementById('statBar' + id).style.width = pct + '%';
}

// ══════════════════════════════════════
//  RENDERIZAR LISTA
// ══════════════════════════════════════
function render() {
  const busKey  = activeSeg === 'ida' ? 'ida_bus'    : 'vuelta_bus';
  const seatKey = activeSeg === 'ida' ? 'ida_asiento': 'vuelta_asiento';
  const q       = norm(document.getElementById('searchIn').value);

  let list = passengers.filter(p => String(p[busKey]) === activeBus);
  if (q) list = list.filter(p => norm(p.nombre).includes(q));

  // Ordenar: pendientes primero (por asiento), luego abordados
  list.sort((a, b) => {
    const aB = !!boarding[a.id + '_' + activeSeg]?.abordado;
    const bB = !!boarding[b.id + '_' + activeSeg]?.abordado;
    if (aB !== bB) return aB ? 1 : -1;
    return (parseInt(a[seatKey]||99)) - (parseInt(b[seatKey]||99));
  });

  const container = document.getElementById('pList');

  if (list.length === 0) {
    container.innerHTML = `<div class="empty">${q ? `🔍 No se encontró "${q}"` : 'No hay pasajeros en esta selección.'}</div>`;
    return;
  }

  container.innerHTML = list.map(p => {
    const key     = p.id + '_' + activeSeg;
    const rec     = boarding[key] || {};
    const boarded = !!rec.abordado;
    const hora    = rec.hora || '';
    const seat    = p[seatKey] || '—';

    return `
      <div class="p-item ${boarded ? 'boarded' : ''}" data-id="${p.id}" onclick="toggle('${p.id}')">
        <div class="p-cb">${boarded ? '✅' : ''}</div>
        <div class="p-info">
          <div class="p-name">${esc(p.nombre)}</div>
          <div class="p-sub">${boarded ? (hora ? 'Abordó · ' + hora : 'Abordó') : 'Pendiente'}</div>
        </div>
        <div class="p-seat">${esc(seat)}</div>
        <div class="p-hora">${boarded && hora ? hora.slice(0,5) : ''}</div>
      </div>`;
  }).join('');
}

// ══════════════════════════════════════
//  TOGGLE ABORDAJE
// ══════════════════════════════════════
function toggle(id) {
  const key     = id + '_' + activeSeg;
  const current = !!boarding[key]?.abordado;
  const newVal  = !current;

  boarding[key] = {
    abordado: newVal,
    hora: newVal ? new Date().toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false}) : ''
  };

  saveBoarding();
  updateStats();
  render();

  const p = passengers.find(p => p.id === id);
  const nombre = p ? p.nombre.split(' ')[0] : id;
  toast(newVal ? `✅ ${nombre} — abordó` : `↩️ ${nombre} — desmarcado`, newVal ? 'ok' : 'undo');
}

// ══════════════════════════════════════
//  RESET DE EMERGENCIA
// ══════════════════════════════════════
function resetConfirm() {
  if (confirm('¿Seguro que deseas borrar TODOS los registros de abordaje?\nEsta acción no se puede deshacer.')) {
    boarding = {};
    saveBoarding();
    updateStats();
    render();
    toast('Registros borrados', '');
  }
}

// ══════════════════════════════════════
//  TOAST
// ══════════════════════════════════════
let _tt = null;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'toast show' + (type === 'ok' ? ' ok' : type === 'undo' ? ' undo' : '');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.className = 'toast', 2800);
}

// ══════════════════════════════════════
//  ESCAPE HTML
// ══════════════════════════════════════
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
