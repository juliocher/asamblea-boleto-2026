<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Panel de Abordaje · Asamblea 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page:     #FAF6F0;
      --bg-card:     #FFFFFF;
      --bg-cream:    #FFF9F0;
      --bg-cream-box:#FEF7ED;
      --orange:      #EA580C;
      --orange-glow: rgba(234,88,12,0.15);
      --orange-light:#F97316;
      --orange-dark: #C2410C;
      --navy:        #0F1E36;
      --navy-soft:   #1E293B;
      --slate:       #475569;
      --muted:       #78716C;
      --green:       #16A34A;
      --green-bg:    #F0FDF4;
      --green-border:#BBF7D0;
      --green-glow:  rgba(22,163,74,0.15);
      --red:         #DC2626;
      --red-bg:      #FEF2F2;
      --border:      #EEDFC2;
      --border-light:#FDE8C8;
      --white:       #FFFFFF;
      --font:        'Plus Jakarta Sans', sans-serif;
      --mono:        'Space Grotesk', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg-page); color: var(--navy); min-height: 100vh; }

    /* ══════════ TOPBAR ══════════ */
    .topbar {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 100%);
      color: #fff; padding: 16px 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      position: sticky; top: 0; z-index: 40;
      box-shadow: 0 4px 20px rgba(15,30,54,0.3);
    }
    .topbar-left   { display: flex; align-items: center; gap: 12px; }
    .topbar-icon   {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--orange); display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; box-shadow: 0 4px 12px rgba(234,88,12,0.35);
    }
    .topbar-title  { font-size: 1rem; font-weight: 800; line-height: 1.2; }
    .topbar-sub    { font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 2px; }
    .topbar-right  { display: flex; align-items: center; gap: 8px; }
    .user-pill {
      background: rgba(234,88,12,0.2); color: var(--orange-light);
      padding: 5px 14px; border-radius: 9999px; border: 1px solid rgba(234,88,12,0.3);
      font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em;
    }
    .btn-logout {
      padding: 7px 14px; border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 8px; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.65);
      font-size: 0.75rem; font-weight: 700; cursor: pointer; font-family: var(--font);
      transition: all 0.15s;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.25); }

    /* ══════════ LOGIN ══════════ */
    #loginScreen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
      background: radial-gradient(ellipse at top, #FFF5E6 0%, var(--bg-page) 50%);
    }
    .login-box {
      background: var(--white); border-radius: 24px;
      box-shadow: 0 12px 48px rgba(15,30,54,0.1), 0 2px 8px rgba(0,0,0,0.04);
      padding: 40px 28px; width: 100%; max-width: 380px;
      border: 1px solid var(--border-light);
    }
    .login-icon-wrap {
      width: 64px; height: 64px; margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
      border-radius: 18px; display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; box-shadow: 0 6px 20px rgba(234,88,12,0.3);
    }
    .login-title { text-align: center; font-size: 1.3rem; font-weight: 800; margin-bottom: 4px; }
    .login-sub   { text-align: center; font-size: 0.82rem; color: var(--muted); margin-bottom: 28px; line-height: 1.5; }
    .field-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
                   letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; display: block; }
    .field-input {
      width: 100%; height: 50px; padding: 0 16px;
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 0.95rem; font-family: var(--font); color: var(--navy);
      background: var(--bg-cream); outline: none; transition: all 0.2s; margin-bottom: 16px;
    }
    .field-input:focus { border-color: var(--orange); background: var(--white); box-shadow: 0 0 0 3px var(--orange-glow); }
    .btn-login {
      width: 100%; height: 52px; background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
      color: #fff; border: none; border-radius: 12px;
      font-size: 0.95rem; font-weight: 800; font-family: var(--font);
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s; box-shadow: 0 4px 16px rgba(234,88,12,0.3);
    }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(234,88,12,0.4); }
    .btn-login:active { transform: translateY(0); }
    .login-err {
      margin-top: 14px; padding: 12px 16px; border-radius: 10px;
      background: var(--red-bg); color: var(--red); border: 1px solid #FECACA;
      font-size: 0.82rem; font-weight: 600; display: none; text-align: center;
    }

    /* ══════════ APP ══════════ */
    #appScreen { display: none; }
    .container { max-width: 700px; margin: 0 auto; padding: 20px 14px 40px; }

    /* ══════════ STATS ══════════ */
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .stat-card {
      background: var(--white); border-radius: 16px;
      padding: 16px 18px; border: 1px solid var(--border-light);
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--orange); border-radius: 0 4px 4px 0;
    }
    .stat-card.ret::before { background: var(--green); }
    .stat-lbl { font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
                letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
    .stat-val { font-size: 1.7rem; font-weight: 900; font-family: var(--mono);
                line-height: 1; color: var(--navy); }
    .stat-pct { font-size: 0.7rem; font-weight: 700; color: var(--orange); margin-left: 6px; }
    .stat-card.ret .stat-pct { color: var(--green); }
    .stat-bar { margin-top: 10px; height: 6px; background: #F5F0E8; border-radius: 9999px; overflow: hidden; }
    .stat-fill { height: 100%; border-radius: 9999px; transition: width 0.5s cubic-bezier(0.22,1,0.36,1); }
    .stat-card .stat-fill  { background: linear-gradient(90deg, var(--orange), var(--orange-light)); }
    .stat-card.ret .stat-fill { background: linear-gradient(90deg, var(--green), #22C55E); }

    /* ══════════ CONTROLES ══════════ */
    .ctrl-section {
      background: var(--white); border-radius: 16px; padding: 14px 16px;
      border: 1px solid var(--border-light); margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .ctrl-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tabs {
      display: flex; border-radius: 10px; overflow: hidden;
      border: 1.5px solid var(--border); background: var(--bg-cream);
    }
    .tab {
      padding: 10px 18px; border: none; background: transparent;
      font-size: 0.8rem; font-weight: 700; font-family: var(--font);
      cursor: pointer; color: var(--muted); transition: all 0.2s;
    }
    .tab.active { background: var(--navy); color: #fff; }
    .bus-tabs { display: flex; gap: 6px; }
    .bus-tab {
      padding: 10px 16px; border: 1.5px solid var(--border); border-radius: 10px;
      background: var(--bg-cream); font-size: 0.8rem; font-weight: 700;
      font-family: var(--font); cursor: pointer; color: var(--muted); transition: all 0.2s;
    }
    .bus-tab.active { background: var(--orange); border-color: var(--orange); color: #fff;
                      box-shadow: 0 3px 10px rgba(234,88,12,0.25); }
    .search-wrap { flex: 1; min-width: 150px; position: relative; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search-in {
      width: 100%; height: 42px; padding: 0 14px 0 38px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 0.85rem; font-family: var(--font); color: var(--navy);
      background: var(--bg-cream); outline: none; transition: all 0.2s;
    }
    .search-in:focus { border-color: var(--orange); background: var(--white); box-shadow: 0 0 0 3px var(--orange-glow); }

    /* ══════════ LISTA DE PASAJEROS ══════════ */
    .p-list { display: flex; flex-direction: column; gap: 6px; }

    .p-item {
      display: flex; align-items: center; gap: 12px;
      background: var(--white); border: 1.5px solid var(--border-light);
      border-radius: 14px; padding: 12px 14px;
      cursor: pointer; transition: all 0.2s ease; user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .p-item:active { transform: scale(0.985); }
    .p-item:hover  { border-color: var(--orange); box-shadow: 0 2px 12px var(--orange-glow); }

    /* ── Estado: ABORDADO ── */
    .p-item.boarded {
      background: var(--green-bg); border-color: var(--green-border);
      box-shadow: 0 2px 12px var(--green-glow);
    }
    .p-item.boarded:hover { border-color: var(--green); }

    /* ── Animación al marcar ── */
    .p-item.just-boarded {
      animation: flashBoard 0.6s ease;
    }
    @keyframes flashBoard {
      0%   { transform: scale(1); }
      15%  { transform: scale(1.03); box-shadow: 0 0 30px var(--green-glow); }
      30%  { transform: scale(0.98); }
      100% { transform: scale(1); }
    }
    .p-item.just-unboarded {
      animation: flashUnboard 0.4s ease;
    }
    @keyframes flashUnboard {
      0%   { transform: scale(1); }
      20%  { transform: scale(0.96); }
      100% { transform: scale(1); }
    }

    /* ── Checkbox ── */
    .p-cb {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      border: 2px solid var(--border); background: var(--bg-cream);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; transition: all 0.25s ease;
    }
    .p-item.boarded .p-cb {
      background: var(--green); border-color: var(--green);
      box-shadow: 0 2px 8px rgba(22,163,74,0.3);
    }

    /* ── Info ── */
    .p-info  { flex: 1; min-width: 0; }
    .p-name  { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--navy); }
    .p-status {
      font-size: 0.72rem; margin-top: 3px; font-weight: 600;
      display: flex; align-items: center; gap: 5px;
    }
    .p-status.pending { color: var(--muted); }
    .p-status.done    { color: var(--green); }

    .p-status-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .p-status.pending .p-status-dot { background: var(--border); }
    .p-status.done .p-status-dot    { background: var(--green); animation: pulse-dot 2s infinite; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    /* ── Asiento ── */
    .p-seat {
      flex-shrink: 0; width: 38px; height: 38px; border-radius: 10px;
      background: var(--bg-cream-box); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.88rem; font-weight: 900; color: var(--orange); font-family: var(--mono);
      transition: all 0.25s;
    }
    .p-item.boarded .p-seat {
      background: var(--green); border-color: var(--green); color: #fff;
      box-shadow: 0 2px 8px rgba(22,163,74,0.25);
    }

    /* ── Hora ── */
    .p-hora {
      flex-shrink: 0; font-size: 0.68rem; font-family: var(--mono); font-weight: 700;
      color: var(--green); min-width: 44px; text-align: right; line-height: 1.3;
    }

    /* ── Botón individual de reiniciar ── */
    .p-reset-btn {
      flex-shrink: 0; width: 32px; height: 32px; border-radius: 8px;
      border: 1.5px solid #FECACA; background: var(--red-bg);
      display: none; align-items: center; justify-content: center;
      cursor: pointer; font-size: 0.8rem; transition: all 0.15s;
      color: var(--red);
    }
    .p-reset-btn:hover { background: #FEE2E2; border-color: var(--red); }
    .p-item.boarded .p-reset-btn { display: flex; }

    .empty {
      text-align: center; padding: 48px 20px; color: var(--muted); font-size: 0.88rem;
      background: var(--white); border-radius: 16px; border: 1px solid var(--border-light);
    }

    /* ══════════ TOAST ══════════ */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 14px 24px; border-radius: 14px;
      font-size: 0.88rem; font-weight: 700; font-family: var(--font);
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), opacity 0.3s;
      z-index: 100; white-space: nowrap;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      display: flex; align-items: center; gap: 10px;
      opacity: 0;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.ok {
      background: linear-gradient(135deg, var(--green), #15803D);
      color: #fff;
    }
    .toast.undo {
      background: var(--white); color: var(--navy);
      border: 1.5px solid var(--border);
    }

    /* ══════════ DANGER ZONE ══════════ */
    .danger-zone {
      margin-top: 32px; padding: 20px;
      background: var(--white); border-radius: 16px;
      border: 1px solid var(--border-light);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .danger-zone-title {
      font-size: 0.78rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-danger {
      padding: 10px 18px; background: var(--white); border: 1.5px solid var(--red);
      border-radius: 10px; color: var(--red); font-size: 0.82rem; font-weight: 700;
      font-family: var(--font); cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-danger:hover { background: var(--red-bg); box-shadow: 0 2px 10px rgba(220,38,38,0.15); }

    /* ══════════ RESPONSIVE ══════════ */
    @media (max-width: 480px) {
      .topbar-sub { display: none; }
      .stat-val   { font-size: 1.35rem; }
      .tab { padding: 9px 14px; font-size: 0.75rem; }
      .bus-tab { padding: 9px 12px; font-size: 0.75rem; }
      .p-hora { min-width: 36px; font-size: 0.62rem; }
      .p-reset-btn { width: 28px; height: 28px; }
    }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ════════ LOGIN ════════ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-icon-wrap">🚌</div>
    <div class="login-title">Panel de Abordaje</div>
    <div class="login-sub">Asamblea de Circuito 2026-2027<br>Sábado 07 Nov · Cusco → Urubamba</div>

    <label class="field-label" for="uUser">Usuario</label>
    <input type="text" id="uUser" class="field-input" placeholder="julio  ó  lino" autocomplete="username">

    <label class="field-label" for="uPass">Contraseña</label>
    <input type="password" id="uPass" class="field-input" placeholder="••••••••" autocomplete="current-password">

    <button class="btn-login" id="btnLogin">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Ingresar
    </button>
    <div class="login-err" id="loginErr">Usuario o contraseña incorrectos.</div>
  </div>
</div>

<!-- ════════ APP ════════ -->
<div id="appScreen">

  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-icon">🚌</div>
      <div>
        <div class="topbar-title">Control de Abordaje</div>
        <div class="topbar-sub">Asamblea 2026-2027 · 07 Nov</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="user-pill" id="userPill">JULIO</span>
      <button class="btn-logout" id="btnLogout">Salir</button>
    </div>
  </div>

  <div class="container">

    <!-- Estadísticas -->
    <div class="stats-row" id="statsRow">
      <div class="stat-card">
        <div class="stat-lbl" id="statLblA">Bus 1 · IDA</div>
        <div><span class="stat-val" id="statValA">0/0</span><span class="stat-pct" id="statPctA"></span></div>
        <div class="stat-bar"><div class="stat-fill" id="statBarA" style="width:0%"></div></div>
      </div>
      <div class="stat-card ret">
        <div class="stat-lbl" id="statLblB">Bus 1 · RETORNO</div>
        <div><span class="stat-val" id="statValB">0/0</span><span class="stat-pct" id="statPctB"></span></div>
        <div class="stat-bar"><div class="stat-fill" id="statBarB" style="width:0%"></div></div>
      </div>
    </div>

    <!-- Controles -->
    <div class="ctrl-section">
      <div class="ctrl-row">
        <div class="tabs">
          <button class="tab active" id="tabIda"    onclick="setSeg('ida')">IDA</button>
          <button class="tab"        id="tabVuelta" onclick="setSeg('vuelta')">RETORNO</button>
        </div>
        <div class="bus-tabs">
          <button class="bus-tab active" id="tBus1" onclick="setBus('1')">Bus 1</button>
          <button class="bus-tab"        id="tBus2" onclick="setBus('2')">Bus 2</button>
        </div>
        <div class="search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" class="search-in" id="searchIn" placeholder="Buscar nombre..." oninput="render()">
        </div>
      </div>
    </div>

    <!-- Lista de pasajeros -->
    <div class="p-list" id="pList"></div>

    <!-- Zona de opciones -->
    <div class="danger-zone">
      <div class="danger-zone-title">⚙️ Opciones avanzadas</div>
      <button class="btn-danger" onclick="resetConfirm()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Reiniciar todos los registros de abordaje
      </button>
    </div>

  </div>
</div>

<script>
// ══════════════════════════════════════
//  CREDENCIALES DE ADMINISTRADORES
// ══════════════════════════════════════
const ADMINS = {
  'julio': '2027Cusco',
  'lino':  '2027Cusco'
};

// ══════════════════════════════════════
//  ESTADO
// ══════════════════════════════════════
let passengers   = [];
let boarding     = {};
let activeUser   = null;
let activeSeg    = 'ida';
let activeBus    = '1';

const LS_BOARD = 'asamblea_boarding_2026';
const LS_USER  = 'asamblea_admin_user';

// ══════════════════════════════════════
//  INICIO
// ══════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  const saved = sessionStorage.getItem(LS_USER);
  if (saved) activeUser = saved;

  try {
    const r = await fetch('passengers_data.json');
    passengers = await r.json();
  } catch(e) {
    passengers = [];
  }

  loadBoarding();
  if (activeUser) showApp();

  document.getElementById('btnLogin').addEventListener('click', doLogin);
  document.getElementById('btnLogout').addEventListener('click', doLogout);
  document.getElementById('uPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  document.getElementById('uUser').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('uPass').focus(); });
});

// ══════════════════════════════════════
//  LOGIN / LOGOUT
// ══════════════════════════════════════
function doLogin() {
  const user = (document.getElementById('uUser').value||'').toLowerCase().trim();
  const pass = document.getElementById('uPass').value||'';
  const err  = document.getElementById('loginErr');

  if (ADMINS[user] && ADMINS[user] === pass) {
    err.style.display = 'none';
    activeUser = user;
    sessionStorage.setItem(LS_USER, user);
    showApp();
  } else {
    err.style.display = 'block';
    document.getElementById('uPass').value = '';
    document.getElementById('uPass').focus();
  }
}

function doLogout() {
  sessionStorage.removeItem(LS_USER);
  activeUser = null;
  document.getElementById('appScreen').style.display   = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('uUser').value = '';
  document.getElementById('uPass').value = '';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display   = 'block';
  document.getElementById('userPill').textContent       = activeUser.toUpperCase();
  updateStats();
  render();
}

// ══════════════════════════════════════
//  PERSISTENCIA
// ══════════════════════════════════════
function loadBoarding() {
  try {
    boarding = JSON.parse(localStorage.getItem(LS_BOARD) || '{}');
  } catch(e) { boarding = {}; }
}

function saveBoarding() {
  localStorage.setItem(LS_BOARD, JSON.stringify(boarding));
}

// ══════════════════════════════════════
//  FILTROS
// ══════════════════════════════════════
function setSeg(seg) {
  activeSeg = seg;
  document.getElementById('tabIda').classList.toggle('active',    seg==='ida');
  document.getElementById('tabVuelta').classList.toggle('active', seg==='vuelta');
  updateStats();
  render();
}

function setBus(bus) {
  activeBus = bus;
  document.getElementById('tBus1').classList.toggle('active', bus==='1');
  document.getElementById('tBus2').classList.toggle('active', bus==='2');
  updateStats();
  render();
}

function norm(s) {
  return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}

// ══════════════════════════════════════
//  ESTADÍSTICAS
// ══════════════════════════════════════
function updateStats() {
  const forIda    = passengers.filter(p => String(p.ida_bus)    === activeBus);
  const forVuelta = passengers.filter(p => String(p.vuelta_bus) === activeBus);

  const abIda    = forIda.filter(p    => boarding[p.id + '_ida']?.abordado).length;
  const abVuelta = forVuelta.filter(p => boarding[p.id + '_vuelta']?.abordado).length;

  setStatEl('A', `Bus ${activeBus} · IDA`,    abIda,    forIda.length);
  setStatEl('B', `Bus ${activeBus} · RETORNO`, abVuelta, forVuelta.length);
}

function setStatEl(id, lbl, ab, total) {
  document.getElementById('statLbl' + id).textContent = lbl;
  document.getElementById('statVal' + id).textContent = `${ab}/${total}`;
  const pct = total > 0 ? Math.round(ab/total*100) : 0;
  document.getElementById('statBar' + id).style.width = pct + '%';
  document.getElementById('statPct' + id).textContent = total > 0 ? `${pct}%` : '';
}

// ══════════════════════════════════════
//  RENDERIZAR LISTA
// ══════════════════════════════════════
function render() {
  const busKey  = activeSeg === 'ida' ? 'ida_bus'    : 'vuelta_bus';
  const seatKey = activeSeg === 'ida' ? 'ida_asiento': 'vuelta_asiento';
  const q       = norm(document.getElementById('searchIn').value);

  let list = passengers.filter(p => String(p[busKey]) === activeBus);
  if (q) list = list.filter(p => norm(p.nombre).includes(q));

  // Ordenar: pendientes primero por asiento, luego abordados por hora
  list.sort((a, b) => {
    const aB = !!boarding[a.id + '_' + activeSeg]?.abordado;
    const bB = !!boarding[b.id + '_' + activeSeg]?.abordado;
    if (aB !== bB) return aB ? 1 : -1;
    return (parseInt(a[seatKey]||99)) - (parseInt(b[seatKey]||99));
  });

  const container = document.getElementById('pList');

  if (list.length === 0) {
    container.innerHTML = `<div class="empty">${q ? `🔍 No se encontró "${esc(q)}"` : 'No hay pasajeros en esta selección.'}</div>`;
    return;
  }

  container.innerHTML = list.map(p => {
    const key     = p.id + '_' + activeSeg;
    const rec     = boarding[key] || {};
    const boarded = !!rec.abordado;
    const hora    = rec.hora || '';
    const seat    = p[seatKey] || '—';
    const statusClass = boarded ? 'done' : 'pending';
    const statusText  = boarded
      ? `✓ Abordó${hora ? ' a las ' + hora : ''}`
      : '○ Pendiente de abordaje';

    return `
      <div class="p-item ${boarded ? 'boarded' : ''}" data-id="${p.id}">
        <div class="p-cb" onclick="toggle('${p.id}')">${boarded ? '✓' : ''}</div>
        <div class="p-info" onclick="toggle('${p.id}')">
          <div class="p-name">${esc(p.nombre)}</div>
          <div class="p-status ${statusClass}">
            <span class="p-status-dot"></span>
            ${statusText}
          </div>
        </div>
        <div class="p-seat">${esc(seat)}</div>
        <button class="p-reset-btn" onclick="event.stopPropagation(); resetOne('${p.id}')" title="Reiniciar marca">↩</button>
      </div>`;
  }).join('');
}

// ══════════════════════════════════════
//  TOGGLE ABORDAJE
// ══════════════════════════════════════
function toggle(id) {
  const key     = id + '_' + activeSeg;
  const current = !!boarding[key]?.abordado;
  const newVal  = !current;

  boarding[key] = {
    abordado: newVal,
    hora: newVal ? new Date().toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false}) : ''
  };

  saveBoarding();
  updateStats();
  render();

  // Animación visual
  const el = document.querySelector(`.p-item[data-id="${id}"]`);
  if (el) {
    el.classList.add(newVal ? 'just-boarded' : 'just-unboarded');
    setTimeout(() => el.classList.remove('just-boarded', 'just-unboarded'), 700);
  }

  const p = passengers.find(p => p.id === id);
  const nombre = p ? p.nombre_corto || p.nombre.split(' ').slice(0,2).join(' ') : id;

  if (newVal) {
    const hora = boarding[key].hora;
    toast(`✅ ${nombre} — abordó a las ${hora}`, 'ok');
  } else {
    toast(`↩️ ${nombre} — marca reiniciada`, 'undo');
  }
}

// ══════════════════════════════════════
//  REINICIAR MARCA INDIVIDUAL
// ══════════════════════════════════════
function resetOne(id) {
  const key = id + '_' + activeSeg;
  if (!boarding[key]?.abordado) return;

  const p = passengers.find(p => p.id === id);
  const nombre = p ? p.nombre_corto || p.nombre.split(' ').slice(0,2).join(' ') : id;

  boarding[key] = { abordado: false, hora: '' };
  saveBoarding();
  updateStats();
  render();

  const el = document.querySelector(`.p-item[data-id="${id}"]`);
  if (el) {
    el.classList.add('just-unboarded');
    setTimeout(() => el.classList.remove('just-unboarded'), 500);
  }

  toast(`↩️ ${nombre} — marca reiniciada`, 'undo');
}

// ══════════════════════════════════════
//  RESET TOTAL
// ══════════════════════════════════════
function resetConfirm() {
  const seg = activeSeg === 'ida' ? 'IDA' : 'RETORNO';
  const msg = `¿Reiniciar TODAS las marcas de abordaje?\n\nBus ${activeBus} · ${seg}\n\nEsta acción no se puede deshacer.`;
  if (confirm(msg)) {
    // Solo resetear el bus + tramo activo
    const busKey = activeSeg === 'ida' ? 'ida_bus' : 'vuelta_bus';
    const affected = passengers.filter(p => String(p[busKey]) === activeBus);
    affected.forEach(p => {
      const key = p.id + '_' + activeSeg;
      if (boarding[key]) {
        boarding[key] = { abordado: false, hora: '' };
      }
    });
    saveBoarding();
    updateStats();
    render();
    toast(`🔄 Marcas reiniciadas — Bus ${activeBus} ${seg}`, 'undo');
  }
}

// ══════════════════════════════════════
//  TOAST
// ══════════════════════════════════════
let _tt = null;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'toast show' + (type === 'ok' ? ' ok' : type === 'undo' ? ' undo' : '');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.className = 'toast', 3200);
}

// ══════════════════════════════════════
//  ESCAPE HTML
// ══════════════════════════════════════
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
